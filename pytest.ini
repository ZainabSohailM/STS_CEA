[pytest]

addopts =
    -ra
    --strict-markers
    --html=report/report.html
    --self-contained-html
    --screenshot=only-on-failure
    --output=test-results

testpaths = tests

markers =
    functional: core user-workflow (happy-path) tests
    negative: negative / input-validation tests
    api: REST API CRUD tests
    network: network mocking tests
    crossbrowser: tests run on all three browser engines
    planted_bug: the deliberate bug test that fails on purpose
